[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rul-predictive-maintenance"
version = "0.1.0"
description = "Remaining-useful-life prediction for turbofan engines (NASA C-MAPSS), served on Azure."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyodbc>=5.1",
    "azure-identity>=1.16",
    "azure-storage-blob>=12.19",
    "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
train = ["pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses Depends() as a default value by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
